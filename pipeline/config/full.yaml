# Full grid of Sivula et al. (2025), as in simulated/setup_all.py.
cells: config/cells_full.tsv
results: results/full

n_trial: 2000
n_test: 4000
# test sets per binomial cell; quadrature makes them costlier to score
n_test_binomial: 250
# a poisson cell sums over a count grid on top of that quadrature
n_test_poisson: 50
seed: 2958319

# pointwise scores computed by rule score
scores: [elpd, sqe, ae, rps, srps, acc]
# measures compared by rule compare; each needs its score in `scores`.
# brier, acc and bacc are computed for the binomial cells only.
measures: [elpd, mlpd, ic, mse, mae, rmse, r2, rps, srps,
           brier, acc, bacc]

# cells shown in the figures, as in simulated/plot_all__*.py
plot:
  n_obs: [16, 32, 64, 128, 256, 512, 1024]
  beta_t: [0.0, 0.2, 1.0]
  out_dev: [0.0, 20.0, 200]
  tau2: "none"
  moments_beta_t: [0.0, 0.1, 0.2, 0.5, 1.0]

# paper figures for the side-by-side pages (relative to the pipeline folder)
paper_figs:
  calibration: ../simulated/figs/fig_calib_n_b_both.pdf
  joint: ../simulated/figs/fig_joint.pdf
  moments: ../simulated/figs/fig_moments_n_b.pdf
  var_ratio: ../simulated/figs/fig_var_ratioi_n_b.pdf
  err: ../simulated/figs/fig_err_n_b_both.pdf
  errdirection: ../simulated/figs/fig_errdirection_n_b_both.pdf

# Cells of the binomial figures, where out_dev is on the logit scale.
plot_binomial:
  out_dev: [0.0, 5.0]

# Cells of the poisson figures, where out_dev is on the log scale.
plot_poisson:
  out_dev: [0.0, 2.0]
