# Full grid on Aalto Triton with Slurm, started by snakemake_slurm.sh.
# Follows https://github.com/AaltoRSE/snakemake-triton-example
executor: slurm
configfile: config/full.yaml
software-deployment-method: conda
conda-frontend: mamba
jobs: 200
latency-wait: 60
retries: 1

default-resources:
  slurm_partition: batch
  mem_mb: 2000
  runtime: 10

# Runtimes from a laptop test (3 s per trial for n_obs = 1024), doubled.
# A chunk group (fit + score + compare) runs in series, so Slurm gets the
# sum: 10 + 50 + 10 = 70 min. The longest groups take about 25 min on the
# laptop (obs_per_chunk = 256 in make_cells.py).
# summarise: all 3.5 million trials in memory.
# data, combine and the plots are localrules: they run in the Snakemake job.
set-resources:
  score:
    mem_mb: 4000
    runtime: 50
  summarise:
    mem_mb: 16000
    runtime: 60
